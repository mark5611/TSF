name: scrape
on:
  schedule:
    - cron: "*/17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python main.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add stationPrices.json
          git add -A && git diff --cached --quiet || (git commit -m "update prices" && git push)
